services:
  frontend:
    build: .
    env_file:
      - .env
    volumes:
      - frontend_logs:/var/log

    networks:
      - app_network
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public

      # 🔹 HTTP router: ловим запросы на /spravki
      - traefik.http.routers.frontend.rule=Host(`sesc-it-team.ru`) && PathPrefix(`/spravki`)
      - traefik.http.routers.frontend.entrypoints=web
      - traefik.http.routers.frontend.middlewares=frontend-strip,frontend-headers

      # 🔹 HTTPS router с Let's Encrypt
      - traefik.http.routers.frontend-secure.rule=Host(`sesc-it-team.ru`) && PathPrefix(`/spravki`)
      - traefik.http.routers.frontend-secure.entrypoints=websecure
      - traefik.http.routers.frontend-secure.tls=true
      - traefik.http.routers.frontend-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.frontend-secure.middlewares=frontend-strip,frontend-headers

      # 🔹 Middleware 1: удаляем /spravki перед проксированием в контейнер
      - traefik.http.middlewares.frontend-strip.stripprefix.prefixes=/spravki
      - traefik.http.middlewares.frontend-strip.stripprefix.forceSlash=false

      # 🔹 Middleware 2: безопасные заголовки для статики
      - traefik.http.middlewares.frontend-headers.headers.contenttypenosniff=true
      - traefik.http.middlewares.frontend-headers.headers.referrerpolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.frontend-headers.headers.accesscontrolallowmethods=GET,OPTIONS
      - traefik.http.middlewares.frontend-headers.headers.accesscontrolalloworiginlist=*

      # 🔹 Сервис: порт внутри контейнера (serve слушает 80)
      - traefik.http.services.frontend.loadbalancer.server.port=80

volumes:
  frontend_logs:

networks:
  app_network:
    driver: bridge
  traefik-public:
    external: true
    name: traefik-public